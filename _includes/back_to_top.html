{%- comment -%}
  Floating back-to-top button. Opt-in: flow.back_to_top: true.
{%- endcomment -%}
{%- if site.flow.back_to_top -%}
<button type="button" class="button is-small back-to-top" x-data="{ show: false }"
        x-init="window.addEventListener('scroll', () => { show = window.scrollY > 400 }, { passive: true })"
        x-show="show" x-cloak x-transition.opacity
        @click="window.scrollTo({ top: 0, behavior: 'smooth' })"
        aria-label="Back to top">
  <span class="icon">{% icon_lucide arrow-up %}</span>
</button>
{%- endif %}
