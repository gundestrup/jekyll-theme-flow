{%- assign favicon_path = site.flow.favicon | default: site.favicon_ico -%}
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% seo %}
  {% if page.noindex or page.layout == "archive" %}<meta name="robots" content="noindex">{% endif %}
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
  {% if favicon_path and site.flow.favicon_enabled != false %}<link rel="icon" href="{{ favicon_path | relative_url | escape }}">{% endif %}
  {% include head_custom.html %}
</head>
