<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description | strip_html | strip }}">
  <link rel="stylesheet" href="{{ '/assets/css/theme.css' | relative_url }}">
  {% if site.favicon_ico %}<link rel="shortcut icon" href="{{ site.favicon_ico | relative_url }}">{% endif %}
</head>
