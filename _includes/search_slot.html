{%- comment -%}
  Search slot for jekyll-client-search. Renders nothing unless
  site.client_search.enabled. include.input_size: "" or " is-small".
{%- endcomment -%}
{%- if site.client_search.enabled -%}
{%- assign slot_id = include.input_size | default: "full" | slugify -%}
<div class="flow-search" data-client-search-dropdown>
  <form class="control has-icons-left" role="search" autocomplete="off" data-cs-dropdown-form>
    <input class="input{{ include.input_size }}" type="search" name="q" autocomplete="off"
           placeholder="{{ site.flow.search_placeholder | default: "Search" }}"
           aria-expanded="false" aria-controls="flow-search-results-{{ slot_id }}"
           data-cs-dropdown-input>
    <span class="icon is-left" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
  </form>
  <ul id="flow-search-results-{{ slot_id }}" class="flow-search-results"
      role="listbox" aria-hidden="true" data-cs-dropdown-results></ul>
</div>
{%- endif %}
