title: Flow Demo
description: Demo site for jekyll-theme-flow

flow:
  layout: sidebar-left   # sidebar-left | sidebar-right | topnav | bare
  # logo: /assets/images/logo.svg
  # logo_enabled: true
  # favicon: /assets/favicon.ico
  # favicon_enabled: true
  # search_placeholder: Search

# Icons via jekyll-icon-flow — {% icon %} / {% icon_lucide %} /
# {% icon_simple %} / {% icon_custom %}
icon_flow:
  pack: lucide            # default pack for {% icon %}
  # enabled: true         # false = icon tags render nothing
  # custom_dir: assets/icons/custom

client_search:
  enabled: true
  engine: minisearch
  include_pages: true
  dropdown:
    enabled: true
    redirect_url: /search/

plugins:
  - jekyll-client-search
