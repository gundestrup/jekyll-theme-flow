# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
sonar.organization=gundestrup
sonar.projectKey=gundestrup_jekyll-theme-flow
sonar.projectName=jekyll-theme-flow

sonar.sources=.
sonar.test.inclusions=test/**
sonar.exclusions=_sass/bulma/**,assets/js/alpine.min.js,coverage/**,vendor/**

# Layouts delegate <title> to {% seo %} inside _includes/head.html — the web
# analyzer can't follow Jekyll includes or expand the tag. sonar.issue.ignore
# .multicriteria is unreliable here, so suppressions live as //NOSONAR markers
# inside {% comment %}s on the <html> line of _layouts/default.html and on the
# <head> line of _includes/head.html.

# SimpleCov JSON report emitted by test/test_helper.rb in CI
sonar.ruby.coverage.reportPaths=coverage/coverage.json
