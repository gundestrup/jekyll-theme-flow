# SonarQube Cloud configuration (CI-based analysis via GitHub Actions).
sonar.organization=gundestrup
sonar.projectKey=gundestrup_jekyll-theme-flow
sonar.projectName=jekyll-theme-flow

sonar.sources=.
sonar.test.inclusions=spec/**
sonar.exclusions=_sass/bulma/**,assets/js/alpine.min.js,coverage/**,vendor/**

# Layouts delegate <title> to the shared _includes/head.html — the web
# analyzer can't follow Jekyll includes. sonar.issue.ignore.multicriteria is
# unreliable here, so the suppression lives as a //NOSONAR marker inside a
# {% comment %} on the <html> line of _layouts/default.html.

# SimpleCov JSON report emitted by spec/spec_helper.rb in CI
sonar.ruby.coverage.reportPaths=coverage/coverage.json
