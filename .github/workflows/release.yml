name: Release gem

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build and publish RubyGem
    runs-on: ubuntu-latest
    environment: release
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@4e97ecde5048e1e0816923020652678063ffbf65 # v1.339.0
        with:
          bundler-cache: true
          # no ruby-version: — setup-ruby reads .ruby-version (single source)

      - name: Install Semgrep
        run: pipx install semgrep==1.182.0

      - name: Verify version and run release checks
        run: |
          test "v$(bundle exec rake version:show)" = "$GITHUB_REF_NAME"
          bundle exec rake version:pre_release

      - name: Build gem
        run: gem build jekyll-theme-flow.gemspec

      - name: Upload gem to GitHub release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: jekyll-theme-flow-*.gem

      - name: Publish to RubyGems
        uses: rubygems/release-gem@5c53f5308233b7c0f47411f0471b3faae6fa57b2 # v1.4.2
