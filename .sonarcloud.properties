sonar.sources=.
sonar.test.inclusions=spec/**
sonar.exclusions=_sass/bulma/**,assets/js/alpine.min.js,coverage/**,vendor/**

# Layouts delegate <title> to the shared _includes/head.html — the web
# analyzer can't follow Jekyll includes.
sonar.issue.ignore.multicriteria=1
sonar.issue.ignore.multicriteria.1.ruleKey=Web:PageWithoutTitleCheck
sonar.issue.ignore.multicriteria.1.resourceKey=_layouts/**
